[package]
name = "rovapi-explorer"
version = "0.1.0"
edition = "2024"
description = "Native schedule database explorer for ROVAPI"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_table = "0.7.0"
rovapi = { path = "../.." }
rovapi-models = { path = "../rovapi-models" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0.143"
walkers = "0.52.0"

[dev-dependencies]
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
