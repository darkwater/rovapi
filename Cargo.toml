[workspace]
members = [".", "crates/rovapi-models"]
resolver = "3"

[package]
name = "rovapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
axum = "0.7.9"
csv = "1.4.0"
rovapi-models = { path = "crates/rovapi-models" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.11", features = ["request-id", "trace", "uuid"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
